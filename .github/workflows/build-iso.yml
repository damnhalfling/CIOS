name: Build Live ISO

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-iso'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc*-iso'

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo ">>> Freeing disk space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache /usr/share/swift
          sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' 'php.*' azure-cli \
            google-cloud-cli google-chrome-stable firefox powershell \
            mono-devel 2>/dev/null || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h /

      - name: Install Debian live-build (from Debian repo)
        run: |
          # Remove Ubuntu's live-build (too old, doesn't support grub-efi)
          sudo apt-get remove -y live-build 2>/dev/null || true

          # Add Debian trixie repo (pinned low) to get live-build
          echo "deb http://deb.debian.org/debian trixie main" | sudo tee /etc/apt/sources.list.d/debian-trixie.list
          # Pin it low so it doesn't interfere with Ubuntu packages
          cat <<'PIN' | sudo tee /etc/apt/preferences.d/debian-trixie.pref
          Package: *
          Pin: release n=trixie
          Pin-Priority: 50

          Package: live-build
          Pin: release n=trixie
          Pin-Priority: 900
          PIN
          sudo apt-get update
          sudo apt-get install -y -t trixie live-build
          echo "live-build version: $(lb --version 2>/dev/null || echo unknown)"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap dpkg-dev debhelper \
            debian-archive-keyring xorriso isolinux \
            grub-efi-amd64-bin grub-pc-bin grub-common \
            python3-venv python3-pip python3-pil \
            ninja-build pkg-config git patchelf \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libinput-dev libpixman-1-dev libdrm-dev libseat-dev \
            libxcb1-dev xwayland libgbm-dev libvulkan-dev \
            libxcb-composite0-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-render0-dev libxcb-render-util0-dev libxcb-xfixes0-dev \
            libxcb-xinput-dev libxcb-dri3-dev libxcb-present-dev \
            libxcb-res0-dev libxcb-shm0-dev hwdata libxcb-ewmh-dev \
            libffi-dev libxml2-dev libexpat1-dev \
            libegl1-mesa-dev libgles2-mesa-dev libcairo2-dev \
            mtools dosfstools squashfs-tools
          pip install meson>=1.5.0
          sudo pip install meson>=1.5.0
          sudo apt-get install -y libdisplay-info-dev libliftoff-dev 2>/dev/null || true

      - name: Build wayland 1.23
        run: |
          git clone --depth=1 --branch 1.23.0 https://gitlab.freedesktop.org/wayland/wayland.git /tmp/wayland
          cd /tmp/wayland
          meson setup build --prefix=/usr --libdir=lib/x86_64-linux-gnu -Ddocumentation=false -Dtests=false -Ddtd_validation=false
          ninja -C build
          sudo meson install -C build
          sudo ldconfig

      - name: Build libdisplay-info
        run: |
          if ! pkg-config --exists libdisplay-info; then
            git clone --depth=1 --branch 0.2.0 https://gitlab.freedesktop.org/emersion/libdisplay-info.git /tmp/libdisplay-info
            cd /tmp/libdisplay-info
            meson setup build --prefix=/usr --libdir=lib/x86_64-linux-gnu
            ninja -C build
            sudo meson install -C build
            sudo ldconfig
          fi

      - name: Build libliftoff
        run: |
          if ! pkg-config --exists libliftoff; then
            git clone --depth=1 --branch v0.5.0 https://gitlab.freedesktop.org/emersion/libliftoff.git /tmp/libliftoff
            cd /tmp/libliftoff
            meson setup build --prefix=/usr --libdir=lib/x86_64-linux-gnu
            ninja -C build
            sudo meson install -C build
            sudo ldconfig
          fi

      - name: Build wlroots 0.18.1
        run: |
          git clone --depth=1 --branch 0.18.1 https://gitlab.freedesktop.org/wlroots/wlroots.git /tmp/wlroots
          cd /tmp/wlroots
          meson setup build --prefix=/usr --libdir=lib/x86_64-linux-gnu -Dxwayland=enabled
          ninja -C build
          sudo meson install -C build
          sudo find build -name "*-protocol.h" -exec cp {} /usr/include/wlroots-0.18/ \;
          sudo ldconfig

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          VERSION="${VERSION%-iso}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo ">>> Building ISO for version: $VERSION"

      - name: Build ISO
        run: |
          sudo ./live-build/build-iso.sh "${{ steps.version.outputs.version }}"
        env:
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig

      - name: Upload ISO to Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: live-build/cios-${{ steps.version.outputs.version }}-amd64.iso
          tag_name: ${{ github.ref_name }}
          name: "CIOS ${{ steps.version.outputs.version }} Live ISO"
          body: |
            ## CIOS Live ISO v${{ steps.version.outputs.version }}

            Bootable live ISO. Write to USB:
            ```bash
            sudo dd if=cios-${{ steps.version.outputs.version }}-amd64.iso of=/dev/sdX bs=4M status=progress
            ```

            **Boot chain:** GRUB (invisible) → Plymouth (CIOS logo) → greetd (login) → CIOS Desktop

            **Login:** user `cios`, password `cios`

            **Test in QEMU:**
            ```bash
            qemu-system-x86_64 -cdrom cios-${{ steps.version.outputs.version }}-amd64.iso -m 4G -enable-kvm -device virtio-vga -display gtk
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iso-build-logs
          path: |
            live-build/.build/
            live-build/chroot.log
          retention-days: 7
