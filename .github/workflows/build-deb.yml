name: Build .deb and Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]*'

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff==0.8.6 mypy==1.14.1

      - name: Ruff check (lint)
        run: ruff check cios/ tests/

      - name: Ruff format (formatting)
        run: ruff format --check cios/ tests/

      - name: Mypy (type check core)
        run: mypy cios/core/ --ignore-missing-imports --no-error-summary --exclude "cios/core/(intent_parser|mcp|intelligence|bridge)\.py"

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest --cov=cios --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
        if: always()

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: debian:bookworm
            label: debian12
          - container: ubuntu:24.04
            label: ubuntu2404
          - container: ubuntu:25.04
            label: ubuntu2504

    container:
      image: ${{ matrix.container }}

    steps:
      - name: Install base tools
        run: |
          apt-get update
          apt-get install -y git curl ca-certificates lsb-release sudo

      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          if echo "$VERSION" | grep -q "\-rc"; then
            echo "IS_RC=true" >> "$GITHUB_OUTPUT"
          else
            echo "IS_RC=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        run: |
          apt-get install -y \
            python3 python3-pip python3-venv python3-dev \
            ninja-build pkg-config meson \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libinput-dev libpixman-1-dev libdrm-dev libseat-dev \
            libxcb1-dev xwayland libgbm-dev libvulkan-dev \
            libxcb-composite0-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-render0-dev libxcb-render-util0-dev libxcb-xfixes0-dev \
            libxcb-xinput-dev libxcb-dri3-dev libxcb-present-dev \
            libxcb-res0-dev libxcb-shm0-dev hwdata libxcb-ewmh-dev \
            libffi-dev libxml2-dev libexpat1-dev \
            libegl1-mesa-dev libgles2-mesa-dev libcairo2-dev \
            patchelf libpam0g-dev build-essential
          # Upgrade meson if too old (wlroots 0.18 needs >= 1.5)
          MESON_VER=$(meson --version 2>/dev/null || echo "0.0.0")
          MESON_MAJOR=$(echo "$MESON_VER" | cut -d. -f1)
          MESON_MINOR=$(echo "$MESON_VER" | cut -d. -f2)
          if [ "$MESON_MAJOR" -lt 1 ] || ([ "$MESON_MAJOR" -eq 1 ] && [ "$MESON_MINOR" -lt 5 ]); then
            echo "Meson $MESON_VER is too old, upgrading..."
            pip3 install --break-system-packages "meson>=1.5.0" 2>/dev/null || pip3 install "meson>=1.5.0"
            hash -r
          fi
          # Optional deps (may not exist in all distros)
          apt-get install -y libdisplay-info-dev libliftoff-dev 2>/dev/null || true

      - name: Build and install greetd
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          export PATH="$HOME/.cargo/bin:$PATH"
          git clone --depth=1 --branch 0.10.3 https://git.sr.ht/~kennylevinsen/greetd /tmp/greetd
          cd /tmp/greetd
          cargo build --release
          cp target/release/greetd /usr/bin/greetd
          cp target/release/agreety /usr/bin/agreety
          chmod 755 /usr/bin/greetd /usr/bin/agreety

      - name: Build and install wayland 1.23 (if needed)
        run: |
          SYSTEM_WAYLAND=$(pkg-config --modversion wayland-server 2>/dev/null || echo "0.0.0")
          WAYLAND_MINOR=$(echo "$SYSTEM_WAYLAND" | cut -d. -f2)
          if [ "${WAYLAND_MINOR:-0}" -lt 23 ]; then
            echo "System wayland is $SYSTEM_WAYLAND, building 1.23..."
            git clone --depth=1 --branch 1.23.0 https://gitlab.freedesktop.org/wayland/wayland.git /tmp/wayland \
              || git clone --depth=1 --branch 1.23.0 https://github.com/AquaOS-Project/wayland.git /tmp/wayland
            cd /tmp/wayland
            meson setup build --prefix=/usr --libdir=lib/x86_64-linux-gnu -Ddocumentation=false -Dtests=false -Ddtd_validation=false
            ninja -C build
            meson install -C build
            ldconfig
          else
            echo "System wayland $SYSTEM_WAYLAND is sufficient"
          fi

      - name: Build and install wayland-protocols (if needed)
        run: |
          SYSTEM_WP=$(pkg-config --modversion wayland-protocols 2>/dev/null || echo "0.0")
          WP_MINOR=$(echo "$SYSTEM_WP" | cut -d. -f2)
          if [ "${WP_MINOR:-0}" -lt 35 ]; then
            echo "System wayland-protocols is $SYSTEM_WP, building 1.36..."
            git clone --depth=1 --branch 1.36 https://gitlab.freedesktop.org/wayland/wayland-protocols.git /tmp/wayland-protocols \
              || git clone --depth=1 --branch 1.36 https://github.com/AquaOS-Project/wayland-protocols.git /tmp/wayland-protocols
            cd /tmp/wayland-protocols
            meson setup build --prefix=/usr
            ninja -C build
            meson install -C build
          else
            echo "System wayland-protocols $SYSTEM_WP is sufficient"
          fi

      - name: Build and install libdrm (if needed)
        run: |
          SYSTEM_DRM=$(pkg-config --modversion libdrm 2>/dev/null || echo "0.0.0")
          DRM_MINOR=$(echo "$SYSTEM_DRM" | cut -d. -f2)
          DRM_PATCH=$(echo "$SYSTEM_DRM" | cut -d. -f3)
          NEED_BUILD=false
          if [ "${DRM_MINOR:-0}" -lt 4 ]; then
            NEED_BUILD=true
          elif [ "${DRM_MINOR:-0}" -eq 4 ] && [ "${DRM_PATCH:-0}" -lt 122 ]; then
            NEED_BUILD=true
          fi
          if [ "$NEED_BUILD" = "true" ]; then
            echo "System libdrm is $SYSTEM_DRM, building 2.4.122..."
            git clone --depth=1 --branch libdrm-2.4.122 https://gitlab.freedesktop.org/mesa/drm.git /tmp/libdrm \
              || git clone --depth=1 --branch libdrm-2.4.122 https://github.com/AquaOS-Project/drm.git /tmp/libdrm
            cd /tmp/libdrm
            meson setup build --prefix=/usr --libdir=lib/x86_64-linux-gnu -Dtests=false -Dman-pages=disabled
            ninja -C build
            meson install -C build
            ldconfig
          else
            echo "System libdrm $SYSTEM_DRM is sufficient"
          fi

      - name: Build and install libdisplay-info (if needed)
        run: |
          if ! pkg-config --exists libdisplay-info; then
            git clone --depth=1 --branch 0.2.0 https://gitlab.freedesktop.org/emersion/libdisplay-info.git /tmp/libdisplay-info \
              || git clone --depth=1 --branch 0.2.0 https://github.com/emersion/libdisplay-info.git /tmp/libdisplay-info
            cd /tmp/libdisplay-info
            meson setup build --prefix=/usr --libdir=lib/x86_64-linux-gnu
            ninja -C build
            meson install -C build
            ldconfig
          fi

      - name: Build and install libliftoff (if needed)
        run: |
          if ! pkg-config --exists libliftoff; then
            git clone --depth=1 --branch v0.5.0 https://gitlab.freedesktop.org/emersion/libliftoff.git /tmp/libliftoff \
              || git clone --depth=1 --branch v0.5.0 https://github.com/emersion/libliftoff.git /tmp/libliftoff
            cd /tmp/libliftoff
            meson setup build --prefix=/usr --libdir=lib/x86_64-linux-gnu
            ninja -C build
            meson install -C build
            ldconfig
          fi

      - name: Build and install wlroots 0.18.1
        run: |
          git clone --depth=1 --branch 0.18.1 https://gitlab.freedesktop.org/wlroots/wlroots.git /tmp/wlroots \
            || git clone --depth=1 --branch 0.18.1 https://github.com/AquaOS-Project/wlroots.git /tmp/wlroots
          cd /tmp/wlroots
          meson setup build --prefix=/usr --libdir=lib/x86_64-linux-gnu -Dxwayland=enabled
          ninja -C build
          meson install -C build
          find build -name "*-protocol.h" -exec cp {} /usr/include/wlroots-0.18/ \;
          ldconfig
          pkg-config --modversion wlroots-0.18

      - name: Build .deb package
        run: bash build-deb.sh "${{ steps.version.outputs.VERSION }}"
        env:
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig

      - name: Rename .deb with distro suffix
        run: |
          ORIGINAL="cios_${{ steps.version.outputs.VERSION }}_amd64.deb"
          TARGET="cios_${{ steps.version.outputs.VERSION }}_${{ matrix.label }}_amd64.deb"
          mv "$ORIGINAL" "$TARGET"
          echo "DEB_FILE=$TARGET" >> "$GITHUB_ENV"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.label }}
          path: ${{ env.DEB_FILE }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *"-rc"* ]]; then
            echo "IS_RC=true" >> "$GITHUB_OUTPUT"
          else
            echo "IS_RC=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all .deb artifacts
        uses: actions/download-artifact@v4
        with:
          path: debs/
          pattern: deb-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la debs/

      - name: Delete previous RC releases (RC only)
        if: steps.version.outputs.IS_RC == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning old RC releases..."
          RELEASES=$(gh release list --limit 100 --json tagName -q '.[].tagName')
          for TAG in $RELEASES; do
            if [[ "$TAG" == *"-rc"* ]]; then
              gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
            fi
          done

      - name: Delete all previous releases (stable only)
        if: steps.version.outputs.IS_RC == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASES=$(gh release list --limit 100 --json tagName -q '.[].tagName')
          for TAG in $RELEASES; do
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          done

      - name: Delete old tags from remote (stable only)
        if: steps.version.outputs.IS_RC == 'false'
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          for TAG in $(git tag -l); do
            if [ "$TAG" != "$CURRENT_TAG" ]; then
              git push origin --delete "$TAG" 2>/dev/null || true
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: debs/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.version.outputs.IS_RC == 'true' }}
          body: |
            ## Downloads

            | File | Target |
            |------|--------|
            | `*_debian12_amd64.deb` | Debian 12 (Bookworm) |
            | `*_ubuntu2404_amd64.deb` | Ubuntu 24.04 (Noble) |
            | `*_ubuntu2504_amd64.deb` | Ubuntu 25.04+ (Plucky / 26.04) |

            Install: `sudo apt install ./cios_<version>_<distro>_amd64.deb`
