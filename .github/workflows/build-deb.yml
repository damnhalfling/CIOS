name: Build .deb and Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff==0.8.6

      - name: Ruff check (lint)
        run: ruff check cios/ tests/

      - name: Ruff format (formatting)
        run: ruff format --check cios/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -e ".[test]"

      - name: Run tests
        run: pytest --cov=cios --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
        if: always()

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build .deb package
        run: bash build-deb.sh "${{ steps.version.outputs.VERSION }}"

      - name: Delete all previous releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching all releases..."
          RELEASES=$(gh release list --limit 100 --json tagName -q '.[].tagName')
          for TAG in $RELEASES; do
            echo "Deleting release $TAG..."
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          done
          echo "All previous releases deleted."

      - name: Delete old tags from remote
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          for TAG in $(git tag -l); do
            if [ "$TAG" != "$CURRENT_TAG" ]; then
              echo "Deleting remote tag $TAG..."
              git push origin --delete "$TAG" 2>/dev/null || true
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: cios_${{ steps.version.outputs.VERSION }}_amd64.deb
          generate_release_notes: true
          draft: false
          prerelease: false
