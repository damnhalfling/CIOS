name: Build .deb and Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc*'

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff==0.8.6 mypy==1.14.1

      - name: Ruff check (lint)
        run: ruff check cios/ tests/

      - name: Ruff format (formatting)
        run: ruff format --check cios/ tests/

      - name: Mypy (type check core)
        run: mypy cios/core/ --ignore-missing-imports --no-error-summary --exclude "cios/core/(intent_parser|mcp|intelligence)\.py" || true

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -e ".[test]"

      - name: Run tests
        run: pytest --cov=cios --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
        if: always()

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          # Strip 'v' prefix: v1.2.0-rc1 → 1.2.0-rc1
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          # Detect if this is an RC release
          if [[ "$VERSION" == *"-rc"* ]]; then
            echo "IS_RC=true" >> "$GITHUB_OUTPUT"
          else
            echo "IS_RC=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config git \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libinput-dev libpixman-1-dev libdrm-dev libseat-dev \
            libxcb1-dev xwayland libgbm-dev libvulkan-dev \
            libxcb-composite0-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-render0-dev libxcb-render-util0-dev libxcb-xfixes0-dev \
            libxcb-xinput-dev libxcb-dri3-dev libxcb-present-dev \
            libxcb-res0-dev libxcb-shm0-dev hwdata libxcb-ewmh-dev \
            libffi-dev libxml2-dev libexpat1-dev \
            libegl1-mesa-dev libgles2-mesa-dev libcairo2-dev
          # Install newer Meson (wlroots 0.18 requires c23 support → Meson 1.5+)
          pip install meson>=1.5.0
          # These may not be in default repos — install if available
          sudo apt-get install -y libdisplay-info-dev libliftoff-dev 2>/dev/null || true

      - name: Build and install wayland 1.23 (system has 1.22)
        run: |
          git clone --depth=1 --branch 1.23.0 https://gitlab.freedesktop.org/wayland/wayland.git /tmp/wayland
          cd /tmp/wayland
          meson setup build --prefix=/usr --libdir=lib/x86_64-linux-gnu -Ddocumentation=false -Dtests=false -Ddtd_validation=false
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Build and install wlroots 0.18.1
        run: |
          git clone --depth=1 --branch 0.18.1 https://gitlab.freedesktop.org/wlroots/wlroots.git /tmp/wlroots
          cd /tmp/wlroots
          meson setup build --prefix=/usr --libdir=lib/x86_64-linux-gnu
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Build .deb package
        run: bash build-deb.sh "${{ steps.version.outputs.VERSION }}"
        env:
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig

      - name: Delete previous RC releases (RC only)
        if: steps.version.outputs.IS_RC == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning old RC releases..."
          RELEASES=$(gh release list --limit 100 --json tagName -q '.[].tagName')
          for TAG in $RELEASES; do
            if [[ "$TAG" == *"-rc"* ]]; then
              echo "Deleting RC release $TAG..."
              gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
            fi
          done

      - name: Delete all previous releases (stable only)
        if: steps.version.outputs.IS_RC == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching all releases..."
          RELEASES=$(gh release list --limit 100 --json tagName -q '.[].tagName')
          for TAG in $RELEASES; do
            echo "Deleting release $TAG..."
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          done
          echo "All previous releases deleted."

      - name: Delete old tags from remote (stable only)
        if: steps.version.outputs.IS_RC == 'false'
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          for TAG in $(git tag -l); do
            if [ "$TAG" != "$CURRENT_TAG" ]; then
              echo "Deleting remote tag $TAG..."
              git push origin --delete "$TAG" 2>/dev/null || true
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: cios_${{ steps.version.outputs.VERSION }}_amd64.deb
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.version.outputs.IS_RC == 'true' }}
