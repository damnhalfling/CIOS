[project]
name = "harmoni-os"
version = "0.13.5"
description = "Harmoni OS — AI-first system interface that replaces apps with intent-driven execution on Linux"
requires-python = ">=3.10"
dependencies = [
    "boto3==1.35.86",
    "prompt_toolkit==3.0.48",
    "rich==13.9.4",
    "psutil==6.1.1",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "pytest-timeout==2.3.1",
    "hypothesis==6.100.0",
]

[tool.setuptools.packages.find]
include = ["harmoni*"]
exclude = ["demo*", "tests*"]

[project.scripts]
harmoni = "harmoni.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
    "--timeout=30",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
collect_ignore_glob = ["**/harmoni/**"]

[tool.coverage.run]
source = ["harmoni"]
omit = [
    "harmoni/ui/*.py",
    "harmoni/main.py",
    "harmoni/infra/voice.py",
    "harmoni/infra/daemon.py",
    "harmoni/infra/monitors.py",
    "harmoni/skills/auto_learn.py",
    "harmoni/skills/clipboard.py",
    "harmoni/skills/window_control.py",
    "harmoni/skills/package_manager.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 35
