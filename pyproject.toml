[project]
name = "cios"
version = "0.16.0"
description = "CIOS — Cognitive Intent-first Operational System. Replaces apps with intent-driven execution on Linux"
requires-python = ">=3.10"
dependencies = [
    "prompt_toolkit==3.0.48",
    "rich==13.9.4",
    "psutil==6.1.1",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "pytest-timeout==2.3.1",
    "hypothesis==6.100.0",
]
dev = [
    "ruff==0.8.6",
    "pre-commit==4.0.1",
]

[tool.setuptools.packages.find]
include = ["cios*"]
exclude = ["demo*", "tests*"]

[project.scripts]
cios = "cios.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
    "--timeout=30",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
collect_ignore_glob = ["**/cios/**"]

[tool.coverage.run]
source = ["cios"]
omit = [
    "cios/ui/*.py",
    "cios/main.py",
    "cios/infra/voice.py",
    "cios/infra/daemon.py",
    "cios/infra/monitors.py",
    "cios/skills/auto_learn.py",
    "cios/skills/clipboard.py",
    "cios/skills/window_control.py",
    "cios/skills/package_manager.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 35

# ── Ruff (linter + formatter) ──────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (modern Python syntax)
    "B",    # flake8-bugbear (common bugs)
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (common in CLI)
    "SIM105", # contextlib.suppress (try/except/pass is more readable here)
    "SIM108", # ternary operator (readability preference)
    "SIM102", # collapsible-if (nested ifs are clearer for intent routing)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F841", "E402", "SIM117"]  # unused vars (setup), late imports, nested with
"cios/skills/gallery_search.py" = ["F401"]  # imports for availability check
"cios/skills/media_player.py" = ["F401"]   # imports for availability check
"cios/ui/onboarding.py" = ["F401"]         # imports for availability check
"cios/ui/**" = ["F841"]                    # Tkinter vars kept for GC prevention
"cios/core/mcp.py" = ["SIM113"]            # done_count used with futures, not simple enumerate
"cios/core/ollama_manager.py" = ["SIM115"] # open() intentional — Popen needs persistent handle

[tool.ruff.lint.isort]
known-first-party = ["cios"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
