[project]
name = "cios"
version = "0.16.0"
description = "CIOS — Cognitive Intent-first Operational System. Replaces apps with intent-driven execution on Linux"
requires-python = ">=3.10"
dependencies = [
    "boto3==1.35.86",
    "prompt_toolkit==3.0.48",
    "rich==13.9.4",
    "psutil==6.1.1",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "pytest-timeout==2.3.1",
    "hypothesis==6.100.0",
]

[tool.setuptools.packages.find]
include = ["cios*"]
exclude = ["demo*", "tests*"]

[project.scripts]
cios = "cios.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
    "--timeout=30",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
collect_ignore_glob = ["**/cios/**"]

[tool.coverage.run]
source = ["cios"]
omit = [
    "cios/ui/*.py",
    "cios/main.py",
    "cios/infra/voice.py",
    "cios/infra/daemon.py",
    "cios/infra/monitors.py",
    "cios/skills/auto_learn.py",
    "cios/skills/clipboard.py",
    "cios/skills/window_control.py",
    "cios/skills/package_manager.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 35
