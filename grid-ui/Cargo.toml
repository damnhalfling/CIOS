[package]
name = "cios-shell"
version = "0.1.0"
edition = "2021"
description = "CIOS Grid Interface - Wayland Shell Overlay"
license = "MIT"
authors = ["CIOS Project"]

[dependencies]
# Wayland client
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
smithay-client-toolkit = { version = "0.19", features = ["calloop"] }
calloop = "0.13"

# Rendering
wgpu = "0.20"
raw-window-handle = "0.6"
glam = "0.27"
bytemuck = { version = "1.14", features = ["derive"] }
pollster = "0.3"

# Logging
env_logger = "0.11"
log = "0.4"

[profile.release]
opt-level = 3
lto = true
strip = true
